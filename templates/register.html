<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 font-sans text-gray-800 min-h-screen flex items-center justify-center py-10">

    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-200 w-full max-w-md">
        <h2 class="text-xl font-bold text-gray-900">Vehicle Registration</h2>
        <p class="text-xs text-gray-500 mb-6">Assign a driver to an open parking space.</p>

        <form action="/register" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Driver Full Name</label>
                <input type="text" name="driver_name" required placeholder="e.g. Maxwell Odhiambo"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Phone Number</label>
                <input type="text" name="phone" required placeholder="07XXXXXXXX"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">License Plate</label>
                    <input type="text" name="license_plate" required placeholder="KJT 123T"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Vehicle Category</label>
                    <select name="vehicle_model" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                        <option value="" disabled selected>Select Vehicle Type</option>
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV / Crossover</option>
                        <option value="Hatchback">Hatchback</option>
                        <option value="Coupe">Coupe</option>
                        <option value="Pickup Truck">Pickup Truck</option>
                        <option value="Minivan / Van">Minivan / Van</option>
                        <option value="Station Wagon">Station Wagon</option>
                        <option value="Convertible">Convertible</option>
                    </select>
                </div>

            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-gray-600 mb-1">Select Parking Slot</label>
                <select name="slot_id"
                    class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm bg-white">
                    <option value="">Auto assign open slot</option>
                    {% for slot in available_slots %}
                    <option value="{{ slot }}">Slot {{ slot }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit"
                class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-lg text-sm transition duration-200 mt-2">
                Confirm Registration & Park
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="/" class="text-xs text-indigo-600 hover:underline">← Back to Dashboard</a>
        </div>
    </div>

</body>

</html>
